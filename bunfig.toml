[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# A `minimumReleaseAgeExcludes` list would bypass that guard, one package per
# entry. There is none: the only one this repo ever had was for
# `@lovable.dev/vite-tanstack-config`, which is gone. Confirm with the user
# before adding any.
