name: CI

on:
  # `push` is deliberately scoped to `main` rather than `["**"]`. A branch with
  # an open pull request matches both triggers, and the two runs cannot be
  # collapsed into one: `github.ref` spells the same branch `refs/heads/<name>`
  # for the push and `refs/pull/<n>/merge` for the pull request, so a shared
  # `concurrency` group cannot key on it. Keying on the branch name instead
  # does collapse them, but only by *cancelling* one — and a cancelled run
  # still posts its `ci` check to the head commit, in a state branch
  # protection reads as failure. That leaves the pull request permanently
  # blocked, which is worse than the problem it fixes (measured on #76).
  #
  # Two concurrent runs are not merely wasteful here: the `e2e` job drives the
  # hosted Supabase project through one shared test account, so they interleave
  # writes to the same rows and fail each other's assertions.
  # `fullyParallel: false` serializes tests within a run and does nothing
  # across runs.
  #
  # The cost of this scoping is that a branch pushed *without* a pull request
  # gets no CI. That is the intended trade: the pull request is where the
  # result is read, and it also stops every branch push writing to the
  # production database.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every `uses:` below is pinned to a commit rather than a tag. A tag is a
# pointer its owner can move, so `@v4` is a standing invitation to run code
# nobody here has reviewed — which is how the tj-actions/changed-files
# compromise reached thousands of repositories in March 2025. A commit cannot
# be moved. The trailing comment names the version the commit is, because a
# bare SHA is unreadable; Dependabot rewrites the pin and the comment together
# (.github/dependabot.yml), so the label cannot drift from what it labels.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Nothing else in this workflow executes a migration. `lint`, `typecheck` and
  # `build` never open a database at all, and `e2e` drives a hosted one that
  # somebody already applied the schema to — so all four pass happily against a
  # migration file that cannot run, and a broken one first surfaces when
  # Lovable Cloud applies it on merge. That is exactly how a duplicate
  # `CREATE TABLE` sat in supabase/migrations undetected until #57 went looking
  # for it.
  #
  # This job replays the directory from nothing, so a migration that does not
  # apply goes red at review time instead. What it asserts is that the SQL
  # executes against Postgres alone — a migration or seed that leans on an
  # object one of the excluded containers creates would pass here and could
  # still differ from a developer's full-stack `bun db:reset`. Nothing in
  # supabase/migrations does today.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # The Supabase CLI is a devDependency rather than a `uses:` step, so the
      # replay runs on the same CLI version a developer gets from `bun db:reset`
      # — and there is no extra action to pin. Docker is already on the runner.
      - run: bun install --frozen-lockfile

      # `supabase db reset` refuses to run against a stopped stack ("supabase
      # start is not running"), so the containers have to come up first. Only
      # Postgres is needed to replay SQL: `-x` names every other service the
      # CLI knows about, which skips a dozen image pulls this job never
      # touches. The seed still works without GoTrue, because the `auth` schema
      # it writes to ships in the Postgres image rather than being created by
      # the Auth container.
      #
      # The list is version-coupled to the CLI, and fails soft either way: a
      # service a future release *adds* is not named here and starts, and a
      # name it *renames or drops* is silently ignored (measured: `-x` with an
      # unknown name exits 0 and starts everything else). Both cost time, and
      # neither can redden this job for a reason that isn't a migration.
      # `supabase start --help` prints the current set.
      #
      # This step applies the migrations too, on its way to a healthy
      # container, so the next one is the second pass over them. Don't collapse
      # the two: what `start` does depends on whether it finds an existing
      # volume to restore from, and "replayed from empty" is the property this
      # job exists to assert.
      #
      # Measured on a runner, not reasoned about: this pair was green on the
      # first run of #85 — 95s here (image pull included) and 16s below, ~2min
      # for the job. Note `[api] enabled = true` in config.toml while
      # `postgrest` is excluded above; the reset's closing "Restarting
      # containers..." does not need it.
      - name: Start local Postgres
        run: >
          bunx supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # The gate itself: drop the database, replay supabase/migrations/*.sql in
      # filename order from empty, then run supabase/seed.sql. The CLI stops at
      # the first statement Postgres rejects and exits non-zero, printing the
      # migration filename, the SQLSTATE and the offending statement.
      - name: Replay every migration from an empty database
        run: bun db:reset

  # One status to require on the branch, so a failure in any job reads as one
  # check rather than a separate one per job to wire into branch protection.
  # Deliberately uncounted now: this line said "three" while `needs:` already
  # listed four, and `security.yml`'s twin comment manages without a number.
  ci:
    needs: [lint, typecheck, build, e2e, migrations]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything that ran did not pass
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job did not pass." >&2
              exit 1
            fi
          done
          echo "All jobs that ran passed."
